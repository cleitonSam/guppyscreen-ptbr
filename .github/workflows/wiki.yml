name: Publish wiki
# Desligado no repositório da versão em português (cleitonSam/guppyscreen-ptbr):
# a pasta wiki/ é o manual em inglês do OpenKE original, e o repositório do
# dono não tem a aba Wiki preparada (a ação falharia). Só roda no original.
on:
  push:
    branches: [main]
    paths: ['wiki/**']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'coreflake1/guppyscreen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync wiki/ to the GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki/
          token: ${{ secrets.GITHUB_TOKEN }}
